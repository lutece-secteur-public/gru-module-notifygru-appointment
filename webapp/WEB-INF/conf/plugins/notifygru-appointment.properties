# uncomment / override value to force a date or time format for the appointment provider
#notifygru.appointment.dateformat=dd/MM/yyyy
#notifygru.appointment.timeformat=HH:mm:mm

# uncomment / override value if senderName is required in SMS notification
#workflow-notifygruappointment.gruprovider.sms.sendername=appointement

# The recap and the response markers of this provider are safe HTML (escaped values joined with <br/>, rich text
# answers kept): notifygru renders them as sanitized HTML in the messages and as plain text in the SMS, subjects and
# status texts. The other markers are text.
workflow-notifygru.markers.rich.provider.notifygru-appointment.ProviderService=recap,reponse_*
